packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  unrs-resolver: true

catalog:
  "@biomejs/biome": ^2.5.4
  "@konomi-app/k2": ^4.2.0
  "@konomi-app/ketch": ^0.4.0
  "@konomi-app/kintone-utilities": ^6.2.0
  "@konomi-app/kintone-utilities-react": ^3.6.0
  "@konomi-app/kintone-utilities-jotai": ^2.6.0
  "@konomi-app/ui": ^6.0.0
  "@konomi-app/ui-react": ^3.0.1
  "@types/node": ^26.1.1
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  jotai: ^2.20.1
  jotai-eager: ^0.2.6
  jotai-effect: ^2.2.3
  jotai-derive: ^0.1.3
  jotai-family: ^1.0.2
  jotai-optics: ^0.4.0
  react: ^19.2.7
  react-dom: ^19.2.7
  typescript: ^6.0.3
  '@konomi-app/biome-config': ^1.4.0
  prettier: ^3.9.5
  tailwindcss: ^4.3.2
  tsx: ^4.23.1
  turbo: ^2.10.4
  vitest: ^4.1.8

catalogMode: strict

minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.4'
  - '@biomejs/cli-darwin-arm64@2.5.4'
  - '@biomejs/cli-darwin-x64@2.5.4'
  - '@biomejs/cli-linux-arm64-musl@2.5.4'
  - '@biomejs/cli-linux-arm64@2.5.4'
  - '@biomejs/cli-linux-x64-musl@2.5.4'
  - '@biomejs/cli-linux-x64@2.5.4'
  - '@biomejs/cli-win32-arm64@2.5.4'
  - '@biomejs/cli-win32-x64@2.5.4'
